services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${DBUSERNAME:-payments_app}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DBPASSWORD:?Set DBPASSWORD}}
      POSTGRES_DB: ${POSTGRES_DB:-${DBNAME:-cornflakes_db}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-${DBUSERNAME:-payments_app}}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-${DBPASSWORD:?Set DBPASSWORD}}
      DB_NAME: ${POSTGRES_DB:-${DBNAME:-cornflakes_db}}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:-20}
      SERVER_LOGIN_RETRY: ${PGBOUNCER_SERVER_LOGIN_RETRY:-1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"

  app:
    build: .
    environment:
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-${DBUSERNAME:-payments_app}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DBPASSWORD:?Set DBPASSWORD}}
      POSTGRES_DB: ${POSTGRES_DB:-${DBNAME:-cornflakes_db}}
      REPLICA_PGBOUNCER_HOST: ${REPLICA_PGBOUNCER_HOST:-}
      REPLICA_PGBOUNCER_PORT: ${REPLICA_PGBOUNCER_PORT:-6432}
    depends_on:
      pgbouncer:
        condition: service_started
    restart: unless-stopped

  # NEW: MinIO object storage

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
