wal_level = replica
max_wal_senders = 10
wal_keep_size = 1GB
hot_standby = on
archive_mode = on
archive_command = 'wal-g wal-push %p'
archive_timeout = 60
synchronous_standby_names = 'ANY 1 (replica1)'
synchronous_commit = on
wal_log_hints = on

listen_addresses = '*'
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
