listen_addresses = '*'
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB
hot_standby = on
wal_log_hints = on

# pgBackRest continuous WAL archiving
archive_mode = on
archive_command = 'pgbackrest --stanza=cornflakes archive-push %p'
archive_timeout = 60
restore_command = 'pgbackrest --stanza=cornflakes archive-get %p %l'
